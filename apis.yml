name: Humanising Autonomy
description: 'Humanising Autonomy is a London-based behavioural AI company that builds
  ethical computer-vision software to understand and predict human behaviour, providing
  context between people and machines. Its "Behaviour AI" platform combines novel deep
  learning, behavioural psychology and statistical AI to analyse existing camera and
  video footage across automotive & ADAS, fleet telematics, city infrastructure &
  planning, and health & safety use cases -- improving road safety and reducing liability.
  The company connects to a customer''s existing cameras, platform or video footage
  rather than exposing a public developer API. Backed by Anthemis. NOTE: the primary
  website (humanisingautonomy.com) is currently unreachable / parked (HTTP 404) as
  of 2026-07-19, indicating the company may be inactive; this profile is reconstructed
  from archived (Wayback) sources -- no public API, SDK registry, or developer portal
  was ever published.'
